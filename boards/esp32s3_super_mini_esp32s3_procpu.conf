# BOARD_ZEPHYR: esp32s3_super_mini/esp32s3/procpu
# BOARD_CHIP: esp32s3
# BOARD_DESC: ESP32-S3 Super Mini
# BOARD_ALIAS: esp32s3_super_mini

# =============================================================================
# ESP32-S3 Super Mini Board Configuration for AkiraOS
# =============================================================================
# WiFi Configuration
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_SHELL_BACKEND_TELNET=n
CONFIG_SHELL_TELNET_SUPPORT_COMMAND=n

CONFIG_WAMR_HEAP_SIZE=16384

CONFIG_HEAP_MEM_POOL_SIZE=45864

# Tighten network buffers (prj.conf sets 12/10 × 256 B; cut to 4 × 128 B).
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=12
CONFIG_NET_MAX_CONN=4
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2048

# OTA over HTTP is impractical without PSRAM (no buffer for the full image).
CONFIG_AKIRA_OTA=n
CONFIG_AKIRA_OTA_HTTP=n
# Embedded web server not useful for headless DevKitC.
CONFIG_AKIRA_HTTP_SERVER=y

# Settings encryption requires mbedTLS AES; disable to slim BSS.
CONFIG_AKIRA_SETTINGS_ENCRYPTION=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

